# Verifies every push and pull request. On main it also deploys the exact dist/ that passed,
# then waits for the live site to serve this commit.
#
# One-time setup, by hand, in the repo's Settings (until then the deploy job fails):
#   Pages -> Build and deployment -> Source: "GitHub Actions".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main finish so a deployment is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Everything but the e2e, which the shards below run against this job's build: about six
    # minutes. M6.4's run on main went past the 45 one job had, its e2e alone past 40 (Readings).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm budgets

      # The build the shards test, so what they pass is what gets deployed.
      - uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            apps/editor/dist
            apps/editor/dist-game
          retention-days: 1

      # The dist/ that passed every check is the one that gets deployed: the deploy waits for the
      # shards too. An artifact deploy is served as-is (no Jekyll), so no .nojekyll is needed.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/editor/dist

  e2e:
    needs: verify
    runs-on: ubuntu-24.04
    # A third of the suite each, side by side: about 14 minutes of M6.4's 40.
    timeout-minutes: 30
    strategy:
      # Every shard runs to its end, so one red run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: built
          path: apps/editor

      # Installs the Chromium that matches the pinned @playwright/test.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/3

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  confirm:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A green deploy job only says the upload worked. This waits until the live
      # version.json names this commit, so "deployed" means people are getting it.
      - name: Live site serves this commit
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in $(seq 1 30); do
            live=$(curl -fsS "${SITE}version.json?attempt=${attempt}" | jq -r .sha || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "live site serves $live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${SITE}version.json never showed $GITHUB_SHA (last seen: ${live:-nothing})"
          exit 1

      # version.json can be right while the page can't start: a build for the wrong base path
      # (D28) uploads fine. This loads what the live page loads, the service worker included.
      - name: Live page loads its files
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: node tools/site-check/src/cli.ts "$SITE"

      # Space-Wrecked's web export, deployed beside the editor (D62): its page, files and worker.
      - name: Space-Wrecked loads its files
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: node tools/site-check/src/cli.ts "${SITE}games/space-wrecked/"

      # The trail's web export (M5.8, D70), its walk.js beside it: the page, its files and worker.
      - name: The trail loads its files
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: node tools/site-check/src/cli.ts "${SITE}games/trail/"

      # Kaldvík's web export, proof #2 (M6.10, D82): its page, files and worker, where Evan walks it.
      - name: Kaldvík loads its files
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: node tools/site-check/src/cli.ts "${SITE}games/kaldvik/"
